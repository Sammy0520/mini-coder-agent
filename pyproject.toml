[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coder-agent"
version = "0.1.0"
description = "A small, inspectable coding agent built without an agent framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.82",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/Sammy0520/mini-coder-agent"
Issues = "https://github.com/Sammy0520/mini-coder-agent/issues"

[project.scripts]
mini-coder = "mini_coder.cli:main"
mini-coder-eval = "mini_coder.evals.cli:main"
mini-coder-gui = "mini_coder.gui.cli:main"
mini-coder-bench = "mini_coder.benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mini_coder.gui" = ["static/*.html", "static/*.css", "static/*.js"]
