[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coder-agent"
version = "0.1.0"
description = "A small, inspectable coding agent built without an agent framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.82",
]

[project.urls]
Repository = "https://github.com/Sammy0520/mini-coder-agent"
Issues = "https://github.com/Sammy0520/mini-coder-agent/issues"

[project.scripts]
mini-coder = "mini_coder.cli:main"
mini-coder-eval = "mini_coder.evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
